name: Release

# Releases are always built from an existing vX.Y.Z tag. The installer is not
# code-signed: no free Authenticode certificate is available to this project.
# Integrity comes from the SHA-256 checksum and the build provenance attestation
# attached to every release instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to build (for example v2.3.0)"
        required: true
        default: "v2.3.0"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/release-constraints.txt

      - name: Validate tag and source version
        id: version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must have the form vX.Y.Z: $env:RELEASE_TAG"
          }
          $headTag = git describe --exact-match --tags HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Checked-out source is not an exact tag."
          }
          $headTag = $headTag.Trim()
          if ($headTag -ne $env:RELEASE_TAG) {
            throw "Checked-out source is $headTag, not $env:RELEASE_TAG."
          }
          $version = (python -c "import tdsnap; print(tdsnap.__version__)").Trim()
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Source version $version does not match tag $env:RELEASE_TAG."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install pinned release inputs
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          python -m pip install --constraint packaging/release-constraints.txt pip
          python -m pip install --constraint packaging/release-constraints.txt ".[ai,desktop,dev]" pyinstaller --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Run tests, including the real-model smoke test
        env:
          TDSNAP_AI_SMOKE: "1"
        run: python -m pytest

      - name: Build application bundle and installer
        id: package
        shell: pwsh
        run: |
          ./packaging/build.ps1 -Version ${{ steps.version.outputs.version }}
          "installer=dist/installer/AACEditor-${{ steps.version.outputs.version }}-windows-x64-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Install and smoke-test package
        shell: pwsh
        run: ./packaging/smoke_test.ps1 -Installer ${{ steps.package.outputs.installer }} -ExpectedVersion ${{ steps.version.outputs.version }} -AllowInstall

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "${{ steps.package.outputs.installer }}"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content -Encoding ascii "$installer.sha256"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.installer }}

      - name: Attach installer to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          body: |
            This installer is not code-signed, so Windows SmartScreen shows
            **Windows protected your PC** on first run. Before choosing
            *More info → Run anyway*, confirm the download is the one this
            workflow built:

            ```powershell
            Get-FileHash .\AACEditor-${{ steps.version.outputs.version }}-windows-x64-setup.exe -Algorithm SHA256
            gh attestation verify .\AACEditor-${{ steps.version.outputs.version }}-windows-x64-setup.exe --repo rjpenny16/AAC-Editor
            ```

            The hash must match `AACEditor-${{ steps.version.outputs.version }}-windows-x64-setup.exe.sha256` below.
          files: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.installer }}.sha256
