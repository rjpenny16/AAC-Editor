name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run unit tests
        run: python -m pytest -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint
        run: ruff check tdsnap tests packaging scripts

      - name: Test with coverage floors
        run: |
          coverage run -m pytest
          coverage report
          python scripts/check_coverage.py

      - name: Audit project dependencies
        run: python -m pip_audit .

  # The integration tests exercise a real TD Snap export (proprietary Tobii
  # content, downloaded rather than committed).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[ai,dev]" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Fetch real page-set fixture
        run: python scripts/fetch_fixture.py

      - name: Run integration tests and real-model AI smoke test
        env:
          TDSNAP_AI_SMOKE: "1"
        run: python -m pytest -v tests/test_integration_example.py tests/test_ai_smoke.py

      # The eval set turns "does this prompt still work?" into a number. The
      # floor is a tripwire against a prompt edit that makes answers much
      # worse; the value to compare release to release is the recorded rate,
      # which is why the report is kept as an artifact.
      - name: Run the AI eval set and record its pass rate
        env:
          TDSNAP_AI_SMOKE: "1"
        run: python -m pytest -v tests/test_ai_eval.py

      - name: Record the pass rate in the job summary
        if: always()
        run: python scripts/ai_eval_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the eval report with the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: ai-eval-report.json
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Windows tests
        run: python -m pytest -v

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          pip install .
          npm ci
          npx playwright install --with-deps chromium

      - name: Lint the frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run browser tests
        run: npm run test:e2e
