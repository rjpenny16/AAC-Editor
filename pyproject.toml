[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aac-editor"
dynamic = ["version"]
description = "Edit AAC page sets with a local web UI and optional on-device AI suggestions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "uiautomation>=2.0.29; sys_platform == 'win32'",
]

[project.optional-dependencies]
ai = ["llama-cpp-python>=0.3"]
desktop = ["pywebview>=5.0"]
dev = [
    "coverage[toml]>=7.6",
    "pip-audit>=2.7",
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
tdsnap = "tdsnap.cli:main"

[project.urls]
Homepage = "https://github.com/rjpenny16/AAC-Editor"
Issues = "https://github.com/rjpenny16/AAC-Editor/issues"

[tool.setuptools.packages.find]
include = ["tdsnap*"]

[tool.setuptools.dynamic]
version = { attr = "tdsnap.__version__" }

[tool.setuptools.package-data]
"tdsnap.web" = ["static/*", "static/assets/*"]

[tool.coverage.run]
branch = true
source = ["tdsnap"]

[tool.coverage.report]
# Global floor. It is bounded by the Windows UI Automation modules, which a
# Linux CI box cannot execute at all, so scripts/check_coverage.py enforces
# real per-module floors on the code that writes to a page set.
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # import sorting
    "B",               # bugbear — real bug shapes, not style
    "SIM",             # simplifications
    "RUF",             # ruff's own checks
    "S",               # bandit; this app writes to a user's page set
    "UP",              # pyupgrade
]
ignore = [
    # PEP 604 unions (`X | None`) are evaluated at runtime on Python 3.9,
    # where they are a TypeError. Re-enable when the floor moves to 3.10.
    # PEP 585 builtin generics (`list[str]`) are fine on 3.9, so UP006/UP035
    # stay on.
    "UP007", "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, build fixture SQL from their own literals, parse the manifest
# this repo ships, and run this repo's own build scripts. None of that is the
# untrusted input these rules exist to catch.
"tests/*" = ["S101", "S314", "S603", "S607", "S608", "SIM115", "UP031"]
